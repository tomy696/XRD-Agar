name: XRDMod
options:
  bundleIdPrefix: com.xrd
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "15.0"

targets:
  XRDMod:
    type: framework
    platform: iOS
    sources:
      - path: XRDMod
        excludes:
          - "inject.js"
          - "Info.plist"
    resources:
      - path: XRDMod/inject.js
    settings:
      base:
        INFOPLIST_FILE: XRDMod/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.xrd.mod
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEFINES_MODULE: YES
        CLANG_ENABLE_MODULES: YES
