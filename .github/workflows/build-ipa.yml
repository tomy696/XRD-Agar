name: Build XRD Dylib

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Framework
        run: |
          xcodebuild build \
            -project XRDMod.xcodeproj \
            -scheme XRDMod \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS=""

      - name: Package Dylib
        run: |
          FRAMEWORK_PATH="build/DerivedData/Build/Products/Release-iphoneos/XRDMod.framework"
          echo "Framework contents:"
          ls -la "$FRAMEWORK_PATH/"

          # Copy raw dylib
          cp "$FRAMEWORK_PATH/XRDMod" XRDMod.dylib

          # Zip the framework
          cd build/DerivedData/Build/Products/Release-iphoneos/
          zip -r "$GITHUB_WORKSPACE/XRDMod-framework.zip" XRDMod.framework
          cd "$GITHUB_WORKSPACE"

          ls -la XRDMod.dylib XRDMod-framework.zip

      - name: Upload Dylib
        uses: actions/upload-artifact@v4
        with:
          name: XRDMod-Dylib
          path: XRDMod.dylib
          retention-days: 30

      - name: Upload Framework
        uses: actions/upload-artifact@v4
        with:
          name: XRDMod-Framework
          path: XRDMod-framework.zip
          retention-days: 30
