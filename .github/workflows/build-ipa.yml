name: Build XRD IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild build \
            -project XRD-Agar.xcodeproj \
            -scheme XRD-Agar \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            ENABLE_ON_DEMAND_RESOURCES=NO

      - name: Create IPA
        run: |
          mkdir -p build/Payload
          cp -r build/DerivedData/Build/Products/Release-iphoneos/XRD-Agar.app build/Payload/
          cd build
          zip -r XRD-Agar.ipa Payload
          ls -la XRD-Agar.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: XRD-Agar-IPA
          path: build/XRD-Agar.ipa
          retention-days: 30
