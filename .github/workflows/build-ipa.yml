name: Build XRD Modded IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build insert_dylib
        run: |
          git clone https://github.com/tyilo/insert_dylib /tmp/insert_dylib
          cd /tmp/insert_dylib
          xcodebuild -project insert_dylib.xcodeproj \
            -scheme insert_dylib \
            -configuration Release \
            SYMROOT=/tmp/insert_dylib_build \
            2>&1 | tail -5
          sudo cp /tmp/insert_dylib_build/Release/insert_dylib /usr/local/bin/
          echo "insert_dylib installed"

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build XRDMod Framework
        run: |
          xcodebuild build \
            -project XRDMod.xcodeproj \
            -scheme XRDMod \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS=""

      - name: Inject XRDMod into agar.io IPA
        run: |
          mkdir -p /tmp/ipa_work
          unzip -o agar.io.ipa -d /tmp/ipa_work

          FRAMEWORK_SRC="build/DerivedData/Build/Products/Release-iphoneos/XRDMod.framework"
          APP_DIR="/tmp/ipa_work/Payload/agar.io.app"

          echo "Copying XRDMod.framework into app..."
          cp -r "$FRAMEWORK_SRC" "$APP_DIR/Frameworks/XRDMod.framework"

          echo "Injecting load command..."
          insert_dylib --strip-codesig --inplace --all-yes \
            "@rpath/XRDMod.framework/XRDMod" \
            "$APP_DIR/agar.io"

          echo "Removing old code signatures..."
          rm -rf "$APP_DIR/_CodeSignature"
          find "$APP_DIR/Frameworks" -name "_CodeSignature" -type d -exec rm -rf {} + 2>/dev/null || true

          echo "Creating modded IPA..."
          cd /tmp/ipa_work
          zip -r "$GITHUB_WORKSPACE/XRD-Agar.ipa" Payload
          ls -la "$GITHUB_WORKSPACE/XRD-Agar.ipa"

      - name: Upload Modded IPA
        uses: actions/upload-artifact@v4
        with:
          name: XRD-Agar-Modded-IPA
          path: XRD-Agar.ipa
          retention-days: 30
